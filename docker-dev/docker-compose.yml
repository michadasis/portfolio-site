version: "3.8"

services:
  db:
    image: mariadb:10.6
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: michadas_database
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"   # host:container — 3307 to avoid clashing with any local MySQL you already run
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d   # auto-runs .sql files on first startup

  api:
    image: php:8.2-cli
    container_name: portfolio_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: sh -c "docker-php-ext-install pdo_mysql > /dev/null && php -S 0.0.0.0:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
